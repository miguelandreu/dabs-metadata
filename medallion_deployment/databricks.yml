# This is a Databricks asset bundle definition for medallion_deployment.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: medallion_deployment
  uuid: 0709ea21-b33d-4734-869b-50988f56cd7c

python:
  venv_path: .venv
  # Functions called to load resources defined in Python. See resources/__init__.py
  resources:
    - "resources:load_resources"

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
    default: meteo_open_data
  schema:
    description: The schema to use
    default: operations

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-dc8e4af3-bd6a.cloud.databricks.com
    variables:
      catalog: workspace
      schema: dev
  prod:
    mode: production
    workspace:
      host: https://dbc-dc8e4af3-bd6a.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/m.andreunieva@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/m.andreunieva@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: m.andreunieva@gmail.com
        level: CAN_MANAGE
